general: 
  img_size: 224
  seed: 1
  num_classes: 8
  dataset_name: 'isic'
  method: 'AIBSD'
  loss_function: 'LADELoss' # LDAM
  num_workers: 16
  train_epochs: 80
  alpha: 0.01
  beta: 0.00

model:
  if_resume: False
  resume_path: ''
  if_freeze_encoder: False
  model_name: resnet50
  pretrained: False
  local_pretrained: True
  teacher_local_pretrained_path: '/public/home/chenweilin/classImbalace-compareMethod/outputs/isic/100_ERM_224_resnet50_False_256_1_50_strong/best.pt'
  student_local_pretrained_path: '/public/home/chenweilin/classImbalace-compareMethod/outputs/isic/100_ERM_224_resnet50_False_256_1_50_strong/best.pt'
 
# 100_ERM_224_resnet50_False_256_1_50_strong
# 100_AIBSD_224_63.28  our_CE
# 100_CBLoss_224_resnet50_False_256_1_50_strong
# 100_AIBSD_CBLoss_224_resnet50_False_128_1_80_strong
# AAAI 100_CBLoss_Focal_224_resnet50_False_256_1_50_strong
# 100_AIBSD_CBLoss_Focal_224_resnet50_False_128_1_80_strong
# AAAI 100_BalancedSoftmax_224_resnet50_False_256_1_50_strong
# 100_AIBSD_BalancedSoftmax_224_resnet50_False_128_1_80_strong
# classImbalace-compareMethod
cuda:
  gpu_id: '0'
  use_gpu: True
  multi_gpu: False

optimizer:
  type: Adam
  learning_rate: 0.0003

datasets:
  imbalance_ratio: 100
  sampler: None
  batch_size: 128
  head: 2
  medium: 5
  tail: 8
  teacher_class: [5, 6, 7]
  img_path: '/public/home/chenweilin/class-imbalance/ISIC2019/ISIC_2019_Training_Input/ISIC_2019_Training_Input/'
  train:
    np_path: './numpy/isic/train_100.npy'
    dict_path: './numpy/isic/dic.npy'
  val:
    np_path: './numpy/isic/val_100.npy'
    dict_path: './numpy/isic/dic.npy'
  test:
    np_path: './numpy/isic/test_100.npy'
    dict_path: './numpy/isic/dic.npy'
  transforms:
    train: 'strong'
    val_test: 'crop'
