general: 
  img_size: 224
  seed: 1
  num_classes: 8
  dataset_name: 'isic'
  method: 'CNP' # VSLoss
  num_workers: 16
  IM_epochs: 100
  Purify_epochs: 20
  beta: 0.5
  stage: 'Purification'  # IM Purification
  test: True
  
model:
  if_resume: False
  resume_path: ''
  if_freeze_encoder: False
  model_name: resnet50
  pretrained: False
  local_pretrained: True
  IM_pretrained_path: '/public/home/chenweilin/classImbalace-compareMethod/models/pytorch_model.bin'
  Purify_pretrained_path: '/public/home/chenweilin/classImbalace-compareMethod/outputs/isic/100_AIBD_None_224_resnet50_False_128_1_strong/IM_best.pt'
  
# IM_pretrained_path: '/public/home/chenweilin/classImbalace-compareMethod/models/pytorch_model.bin'
# Purify_pretrained_path: '/public/home/chenweilin/classImbalace-compareMethod/outputs/isic/100_AIBD_None_224_resnet50_False_128_1_strong/IM_best.pt'
  
cuda:
  gpu_id: '0'
  use_gpu: True
  multi_gpu: False

optimizer:
  type: Adam
  learning_rate: 0.0003
  weight_decay: 0.0005

datasets:
  imbalance_ratio: 100
  sampler: None
  batch_size: 256
  head: 2
  medium: 5
  tail: 8
  img_path: '/public/home/chenweilin/class-imbalance/ISIC2019/ISIC_2019_Training_Input/ISIC_2019_Training_Input/'
  train:
    np_path: './numpy/isic/train_100.npy'
    dict_path: './numpy/isic/dic.npy'
  val:
    np_path: './numpy/isic/val_100.npy'
    dict_path: './numpy/isic/dic.npy'
  test:
    np_path: './numpy/isic/test_100.npy'
    dict_path: './numpy/isic/dic.npy'
  transforms:
    train: 'strong'
    val_test: 'crop'
